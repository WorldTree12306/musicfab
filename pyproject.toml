[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicfab"
version = "0.2.0"
description = "Open-source alternatives to AnthemScore, Melodyne, Transcribe!, RipX, Capella and Guitar Pro"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "musicfab contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
core = ["mido>=1.3", "music21>=9", "librosa>=0.10", "pretty_midi>=0.2"]
transcribe = ["mir_eval>=0.7", "scikit-learn>=1.3", "resampy>=0.4.2,<0.4.3", "onnxruntime>=1.16", "setuptools"]
separate = ["demucs==4.0.1", "dora-search", "openunmix", "einops", "julius>=0.2.3", "lameenc>=1.2", "pyyaml", "tqdm"]
tab = ["pyguitarpro>=0.11"]
render = ["verovio>=4.3"]
pdf = ["pymupdf>=1.24", "resvg-py>=0.3"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "mido>=1.3", "music21>=9", "librosa>=0.10", "pretty_midi>=0.2", "setuptools"]

[project.scripts]
musicfab = "musicfab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: slow integration tests (model inference, stem separation)",
]
