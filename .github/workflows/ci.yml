name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Install ONNX transcription backend (no TensorFlow)
        run: |
          python -m pip install "setuptools>=65,<81" onnxruntime
          python -m pip install basic-pitch --no-deps
          python -m pip install mir_eval scikit-learn "resampy>=0.4.2,<0.4.3"
      - name: Generate test audio
        run: python scripts/gen_test_audio.py
      - name: Dependency versions (public annotations)
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as md
          for pkg in ["numpy", "scipy", "music21", "librosa", "numba", "llvmlite",
                      "onnxruntime", "basic-pitch", "pytest", "soundfile"]:
              try:
                  ver = md.version(pkg)
              except Exception:
                  ver = "MISSING"
              print(f"::notice title={pkg}::{ver}")
          PY
      - name: Unit tests (slow model/stem tests excluded)
        shell: bash
        run: |
          set +e
          python -m pytest -q -m "not slow" --tb=short --color=no 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            python scripts/ci_annotate.py pytest.log
            exit "$rc"
          fi
      - name: CLI smoke test
        run: |
          python -m musicfab.cli version
          python -m musicfab.cli probe tests/fixtures/melody.wav
